{% extends 'checkbook_base.html' %}
{% block title %}Create account | Bluebird Banking{% endblock %}
{% block content %}
    <div class="page-intro">
        <p class="eyebrow">A fresh start</p>
        <h1>Create your account</h1>
        <p class="page-description">Add the account holder's details and an opening deposit to get started.</p>
    </div>
    <div id="account-form" class="panel form-panel">
        <!-- Render the account fields and display any form validation errors. -->
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button id="new-account-button" type="submit" name="Save_Account">Create account</button>
                <a href="{% url 'index' %}">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
